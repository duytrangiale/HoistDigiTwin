# HoistDigiTwin simulation configuration
#
# The values under sources, bins, flasks, skips, and winder are assumptions,
# not measured from a real site. The skip and winder timing is grounded in
# published figures for comparable shaft hoisting systems, see
# reports/simulation_validation.md for the reasoning and sources. Feed rates and bin
# and flask capacity are sized to be consistent with that hoisting rate, and
# get refined further during Phase 1 validation against the synthetic
# twelve month target.

seed: 42

simulation:
  horizon_days: 365 # length of one simulation run, a full simulated year

sources:
  # two ore sources feed one shared conveyor, only one active at a time
  source_a:
    feed_rate_tph: 420 # tonnes per hour, assumption
  source_b:
    feed_rate_tph: 380 # tonnes per hour, assumption
  switch_interval_hours: 8 # how often the active source switches, assumption

bins:
  count: 3
  capacity_tonnes: 200 # per bin, assumption

flasks:
  capacity_tonnes: 15 # per flask, about one skip payload, assumption

skips:
  count: 2 # east and west
  payload_tonnes: 12 # tonnes carried per skip load, from research
  load_time_mean_s: 20 # filling from the flask, from research
  hoist_time_mean_s: 60 # loaded transit up the shaft, from research
  dump_time_mean_s: 10 # tipping at the surface, from research
  return_time_mean_s: 55 # empty transit back down, from research
  cycle_time_cv: 0.1 # coefficient of variation applied to each stage above

winder:
  scheduled_downtime_hours_per_month: 20 # planned maintenance in a typical month, assumption
  breakdown_mtbf_hours: 200 # mean time between random breakdowns, assumption
  breakdown_mttr_hours: 4 # mean time to repair a breakdown, assumption
  # month index is 0 for the first simulated month, so this assumes the run
  # starts in January. These stand in for known historical downtime events,
  # since no real record is available, see reports/simulation_validation.md.
  scheduled_downtime_overrides:
    0: 288 # January, New Year shutdown continues, synthetic target assumption
    6: 355 # July, one bad month, an extended unplanned repair, synthetic target assumption
    11: 280 # December, Christmas and New Year shutdown, synthetic target assumption

  # Phase 6 only: an alternative to breakdown_mtbf_hours where the winder
  # genuinely wears out over each life instead of failing at a constant
  # random rate, so a predictive maintenance policy has a real signal to
  # watch. Not used unless maintenance_policy below is set, see phase6_plan.md.
  health:
    mean_life_hours: 200 # matches breakdown_mtbf_hours, assumption
    weibull_shape: 2.5 # wear out shape, higher clusters failures more tightly around the mean, assumption
    noise_sd: 3 # noise on the observed health reading, on a 0 to 100 scale, assumption
    check_interval_hours: 24 # how often a health reading is taken, assumption
    rolling_window: 3 # readings averaged for the predictive model's input, must match training
    unplanned_repair_mttr_hours: 4 # matches breakdown_mttr_hours, assumption
    planned_repair_mttr_hours: 2 # a repair caught early is assumed quicker than an emergency one, assumption
    predictive_lead_time_hours: 24 # step in early once predicted remaining life drops below this, assumption

  # reactive (fix only after a real breakdown) or predictive (act on an
  # early warning from health). Absent by default, so run_simulation uses
  # breakdown_mtbf_hours above exactly as before.
  # maintenance_policy: reactive

paths:
  data_raw: data/raw
  data_processed: data/processed
  reports: reports
