# Render blueprint: creates both services this dashboard needs in one
# step, see phase7_plan.md for the reasoning and README.md for how to
# actually deploy this. Render's own docs are the source of truth if any
# field name below has changed since this was written.

services:
  # the backend, src/serve/api.py. Free tier: 512MB RAM, a tenth of a CPU
  # core, sleeps after 15 minutes idle. requirements-serve.txt excludes
  # torch and shap on purpose, see phase7_plan.md for why.
  - name: hoistdigitwin-api
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn src.serve.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16

  # the frontend, frontend/. A static site: free, unlimited, never sleeps,
  # unlike the web service above.
  - name: hoistdigitwin-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # fromService only gives a bare host, no scheme, src/api.js adds
      # https:// itself if one is not already present
      - key: VITE_API_URL
        fromService:
          name: hoistdigitwin-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
